[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "waste-identify"
version = "0.8.0"
description = "OpenCV, CNN and LLM based intelligent waste classification system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "pydantic>=2.9,<3",
  "python-multipart>=0.0.12,<1",
  "torch>=2.4,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "pytest-cov>=5,<7"]
training = [
  "matplotlib>=3.9,<4",
  "pillow>=10,<13",
  "scikit-learn>=1.5,<2",
  "torchvision>=0.19,<1",
]
detection = ["ultralytics>=8.3,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
